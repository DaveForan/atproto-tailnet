# docker-compose.coordinator.dev.yml  --  local development stack
#
# Runs Postgres, coordinator, and Caddy in Docker. The TS service runs
# on the host via `npm run dev`.
#
# Usage:
#   docker compose -f docker-compose.coordinator.dev.yml up -d
#   # Then, with .env pointing COORDINATOR_URL to localhost:9443:
#   npm run dev

services:
  coordinator:
    build:
      context: ./coordinator
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      COORD_LISTEN: "0.0.0.0:9443"
      COORD_STORE_BACKEND: postgres
      COORD_CONTROL_KEY_PATH: /var/lib/coordinator/control.key
      COORD_ADMIN_KEY: dev-coordinator-key-local-only-0000000000
      DATABASE_URL: postgresql://atproto_tailnet:atproto_tailnet@postgres:5432/atproto_tailnet
      RUST_LOG: "debug"
    volumes:
      - coord_data:/var/lib/coordinator
    ports:
      - "127.0.0.1:9443:9443"
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9443/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:17-alpine@sha256:526f86d93c6ea08fd3f1fe5605650cacc781b2c6013169a0ad8f42c7d3d84f32
    environment:
      POSTGRES_USER: atproto_tailnet
      POSTGRES_PASSWORD: atproto_tailnet
      POSTGRES_DB: atproto_tailnet
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atproto_tailnet"]
      interval: 5s
      timeout: 3s
      retries: 5

  caddy:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    ports:
      - "127.0.0.1:8180:80"
      - "127.0.0.1:2019:2019"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default

volumes:
  coord_data:
  pgdata:
  caddy_data:
  caddy_config:
