# Copy this folder, change the values, and apply it:
#   kubectl apply -k deploy/kubernetes/overlays/<your-copy>
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

# Your images (build them from ./Dockerfile and ./coordinator/Dockerfile).
# To pin an image to the exact build, use `digest: sha256:...` in place of
# `newTag` (the digest that `docker push` prints).
images:
  - name: atproto-tailnet-app
    newName: registry.example.com/atproto-tailnet/app
    newTag: "1"
  - name: atproto-tailnet-coordinator
    newName: registry.example.com/atproto-tailnet/coordinator
    newTag: "1"

patches:
  # Your domains and operators
  - target: { kind: ConfigMap, name: tailnet-config }
    patch: |-
      - { op: replace, path: /data/PUBLIC_URL, value: "https://tailnets.example.com" }
      - { op: replace, path: /data/BASE_DOMAIN, value: "ts.example.com" }
      - { op: replace, path: /data/CONTROL_DOMAIN, value: "control.example.com" }
      - { op: replace, path: /data/RELAY_DOMAIN, value: "relay.example.com" }
      - { op: replace, path: /data/OPERATOR_DIDS, value: "did:plc:replace-with-your-did" }
  # The same hosts in the Ingress (rules and certificate)
  - target: { kind: Ingress, name: tailnet }
    patch: |-
      - { op: replace, path: /spec/tls/0/hosts, value: ["tailnets.example.com", "control.example.com", "relay-0.relay.example.com", "relay-1.relay.example.com"] }
      - { op: replace, path: /spec/rules/0/host, value: "tailnets.example.com" }
      - { op: replace, path: /spec/rules/1/host, value: "control.example.com" }
      - { op: replace, path: /spec/rules/2/host, value: "relay-0.relay.example.com" }
      - { op: replace, path: /spec/rules/3/host, value: "relay-1.relay.example.com" }
  # The address range of your PostgreSQL (network policy). The base has a
  # placeholder that matches nothing.
  - target: { kind: NetworkPolicy, name: tailnet-allow-database }
    patch: |-
      - { op: replace, path: /spec/egress/0/to/0/ipBlock/cidr, value: "10.0.0.5/32" }
