# Database migrations of the TS service, run once before a new version
# starts. The replicas skip them (SKIP_MIGRATIONS=1), so two pods never
# migrate at the same time. A Job cannot be changed after it ran: delete it
# before each deploy (the README has the command).
apiVersion: batch/v1
kind: Job
metadata:
  name: tailnet-migrate
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tailnet-migrate
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: atproto-tailnet-app
          command: ["npx", "drizzle-kit", "migrate"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: tailnet-secrets, key: DATABASE_URL }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
