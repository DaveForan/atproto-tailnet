# Coordinator, relay role: DERP relay and STUN. Each replica is its own DERP
# region with its own public hostname, so two devices on different relays
# reach each other with no link between relays: a device sends to a peer
# through the home relay of that peer.
#
# Replica N (pod tailnet-relay-N) is region N+1 at relay-N.<RELAY_DOMAIN>.
# For each replica there is a Service for HTTPS (through the Ingress) and a
# LoadBalancer Service for STUN (UDP 3478). To add a replica: raise
# `replicas`, copy the two Services of the last replica, and add the host to
# the Ingress and to DNS.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tailnet-relay
spec:
  serviceName: tailnet-relay
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: tailnet-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tailnet-relay
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: tailnet-relay
      containers:
        - name: relay
          image: atproto-tailnet-coordinator
          # The region id and the hostname come from the ordinal of the pod
          command:
            - /bin/sh
            - -c
            - |
              ordinal="${POD_NAME##*-}"
              export COORD_DERP_REGION_ID="$((ordinal + 1))"
              export COORD_DERP_HOSTNAME="relay-${ordinal}.${RELAY_DOMAIN}"
              exec coord-server
          ports:
            - { name: http, containerPort: 9443 }
            - { name: stun, containerPort: 3478, protocol: UDP }
          env:
            - { name: COORD_ROLE, value: relay }
            - { name: COORD_LISTEN, value: "0.0.0.0:9443" }
            - { name: COORD_STUN_LISTEN, value: "0.0.0.0:3478" }
            - { name: COORD_STORE_BACKEND, value: postgres }
            # The relay key stays the same for the life of the volume
            - { name: COORD_DERP_KEY_PATH, value: /var/lib/coordinator/derp.key }
            - { name: RUST_LOG, value: info }
            - name: POD_NAME
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
            - name: RELAY_DOMAIN
              valueFrom:
                configMapKeyRef: { name: tailnet-config, key: RELAY_DOMAIN }
            # The relay reads the store to admit only registered devices
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: tailnet-secrets, key: DATABASE_URL }
          volumeMounts:
            - { name: data, mountPath: /var/lib/coordinator }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { memory: 512Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 16Mi }
---
# Governing Service of the StatefulSet
apiVersion: v1
kind: Service
metadata:
  name: tailnet-relay
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: tailnet-relay
  ports:
    - { name: http, port: 9443, targetPort: http }
---
apiVersion: v1
kind: Service
metadata:
  name: tailnet-relay-0
spec:
  selector:
    statefulset.kubernetes.io/pod-name: tailnet-relay-0
  ports:
    - { name: http, port: 9443, targetPort: http }
---
apiVersion: v1
kind: Service
metadata:
  name: tailnet-relay-0-stun
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    statefulset.kubernetes.io/pod-name: tailnet-relay-0
  ports:
    - { name: stun, port: 3478, targetPort: stun, protocol: UDP }
---
apiVersion: v1
kind: Service
metadata:
  name: tailnet-relay-1
spec:
  selector:
    statefulset.kubernetes.io/pod-name: tailnet-relay-1
  ports:
    - { name: http, port: 9443, targetPort: http }
---
apiVersion: v1
kind: Service
metadata:
  name: tailnet-relay-1-stun
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    statefulset.kubernetes.io/pod-name: tailnet-relay-1
  ports:
    - { name: stun, port: 3478, targetPort: stun, protocol: UDP }
---
# One relay stays up during node maintenance
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tailnet-relay
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tailnet-relay
