# Coordinator, control role: the Tailscale control protocol and the admin API.
# Replicas share everything through PostgreSQL (configuration, events and
# pending sign-ins). All replicas must use the same Noise control key:
# devices pin it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailnet-control
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: tailnet-control
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tailnet-control
    spec:
      # A device keeps a long request open; give it time to end
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: tailnet-control
      containers:
        - name: coordinator
          image: atproto-tailnet-coordinator
          ports:
            - { name: http, containerPort: 9443 }
          env:
            - { name: COORD_ROLE, value: control }
            - { name: COORD_LISTEN, value: "0.0.0.0:9443" }
            - { name: COORD_STORE_BACKEND, value: postgres }
            - { name: COORD_CONTROL_KEY_PATH, value: /keys/control.key }
            - { name: RUST_LOG, value: info }
            - name: PUBLIC_URL
              valueFrom:
                configMapKeyRef: { name: tailnet-config, key: PUBLIC_URL }
            # Devices without an auth key are sent here to sign in
            - { name: COORD_DEVICE_AUTH_URL, value: "$(PUBLIC_URL)/device" }
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: tailnet-secrets, key: DATABASE_URL }
            - name: COORD_ADMIN_KEY
              valueFrom:
                secretKeyRef: { name: tailnet-secrets, key: COORDINATOR_API_KEY }
          volumeMounts:
            - { name: control-key, mountPath: /keys, readOnly: true }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: control-key
          secret:
            secretName: tailnet-secrets
            defaultMode: 0440
            items:
              - { key: CONTROL_KEY, path: control.key }
---
apiVersion: v1
kind: Service
metadata:
  name: tailnet-control
spec:
  selector:
    app.kubernetes.io/name: tailnet-control
  ports:
    - { name: http, port: 9443, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tailnet-control
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tailnet-control
