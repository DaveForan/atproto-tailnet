# docker-compose.production.yml  --  atproto-tailnet production stack
#
# Usage:
#   cp .env.example .env   # then edit with real values
#   docker compose -f docker-compose.production.yml up -d
#
# Prerequisites:
#   - Docker Engine with Compose v2
#   - Wildcard DNS pointing *.ts.yourdomain.com to this host
#   - A TLS strategy selected in .env (see caddy/tls-strategies/)

services:
  # ---------- Application -------------------------------------------------
  app:
    # Headscale mode drives Docker through the socket, which is root-equivalent anyway.
    user: "0:0"
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-atproto_tailnet}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-atproto_tailnet}
      SESSION_SECRET: ${SESSION_SECRET}
      PORT: "3000"
      PUBLIC_URL: ${PUBLIC_URL:?PUBLIC_URL must be set}
      BASE_DOMAIN: ${BASE_DOMAIN:?BASE_DOMAIN must be set}
      # Caddy admin lives on the private caddy_admin network (app only)
      CADDY_ADMIN_URL: http://10.250.250.2:2019
      HEADSCALE_IMAGE: ${HEADSCALE_IMAGE:-headscale/headscale:0.29.1}
      HEADSCALE_PORT_RANGE_START: ${HEADSCALE_PORT_RANGE_START:-10001}
      HEADSCALE_PORT_RANGE_END: ${HEADSCALE_PORT_RANGE_END:-10100}
      # Must be the same absolute path on the host and in this container: the
      # app writes tenant configs here, then asks the HOST Docker daemon (via
      # the socket) to bind-mount <dir>/<slug> into each tenant container.
      HEADSCALE_DATA_DIR: ${HEADSCALE_HOST_DATA_DIR:-/srv/atproto-tailnet/headscale}
      HEADSCALE_NETWORK: atproto-tailnet-tenants
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ATPROTO_PRIVATE_KEY: ${ATPROTO_PRIVATE_KEY:-}
      FEDERATION_KEY_ENCRYPTION_KEY: ${FEDERATION_KEY_ENCRYPTION_KEY:-}
      # Single-organisation self-hosting only: allow webhooks to private hosts
      WEBHOOK_ALLOW_PRIVATE: ${WEBHOOK_ALLOW_PRIVATE:-false}
      FEDERATION_ENABLED: ${FEDERATION_ENABLED:-false}
      # Caddy is the single proxy in front of the app
      TRUST_PROXY: "1"
      OPERATOR_DIDS: ${OPERATOR_DIDS:-}
    volumes:
      # Docker socket -- required to manage per-tenant Headscale containers
      - /var/run/docker.sock:/var/run/docker.sock
      # Persistent Headscale tenant data (configs + SQLite DBs). A host bind
      # mount at the identical path — a named volume would leave the host-side
      # path the tenant containers get empty. Create it first:
      #   mkdir -p /srv/atproto-tailnet/headscale
      - ${HEADSCALE_HOST_DATA_DIR:-/srv/atproto-tailnet/headscale}:${HEADSCALE_HOST_DATA_DIR:-/srv/atproto-tailnet/headscale}
    networks:
      internal:
      # Fixed address so it can never take Caddy's (10.250.250.2)
      caddy_admin:
        ipv4_address: 10.250.250.3
    expose:
      - "3000"

  # ---------- PostgreSQL --------------------------------------------------
  postgres:
    image: postgres:17-alpine@sha256:526f86d93c6ea08fd3f1fe5605650cacc781b2c6013169a0ad8f42c7d3d84f32
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atproto_tailnet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-atproto_tailnet}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atproto_tailnet}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------- Caddy reverse proxy ----------------------------------------
  caddy:
    # For on-demand or manual TLS: use stock image (no DNS plugins needed)
    #   image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    # For DNS-01 strategies: build with the provider module
    #   build:
    #     context: .
    #     dockerfile: Dockerfile.caddy
    #     args:
    #       CADDY_DNS_PLUGINS: "github.com/caddy-dns/route53"
    image: ${CADDY_IMAGE:-atproto-tailnet-caddy:local}
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile.caddy
      args:
        CADDY_DNS_PLUGINS: ${CADDY_DNS_PLUGINS:-}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3 / QUIC
    environment:
      # Admin API bound to the caddy_admin network only: not reachable from
      # the tenant Headscale containers or anything else on internal/tenants.
      CADDY_ADMIN_LISTEN: 10.250.250.2:2019
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN must be set}
      BASE_DOMAIN: ${BASE_DOMAIN:?BASE_DOMAIN must be set}
      # DNS-01 provider credentials (set whichever your strategy needs)
      CF_API_TOKEN: ${CF_API_TOKEN:-}
      DO_AUTH_TOKEN: ${DO_AUTH_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      RFC2136_SERVER: ${RFC2136_SERVER:-}
      RFC2136_KEY_NAME: ${RFC2136_KEY_NAME:-}
      RFC2136_KEY: ${RFC2136_KEY:-}
      ACMEDNS_SERVER_URL: ${ACMEDNS_SERVER_URL:-}
      ACMEDNS_USERNAME: ${ACMEDNS_USERNAME:-}
      ACMEDNS_PASSWORD: ${ACMEDNS_PASSWORD:-}
      ACMEDNS_SUBDOMAIN: ${ACMEDNS_SUBDOMAIN:-}
      HETZNER_API_TOKEN: ${HETZNER_API_TOKEN:-}
      VULTR_API_KEY: ${VULTR_API_KEY:-}
    volumes:
      - ./Caddyfile.production:/etc/caddy/Caddyfile
      - ./caddy/tls-strategies/${TLS_STRATEGY:-on-demand}:/etc/caddy/tls-strategy:ro
      # Only used by TLS_STRATEGY=manual (wildcard.pem + wildcard.key)
      - ${CADDY_CERTS_DIR:-./caddy/certs}:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      internal:
      tenants:
      caddy_admin:
        ipv4_address: 10.250.250.2

  # ---------- Headscale port range ----------------------------------------
  # Headscale containers are created dynamically by the app via Docker socket.
  # Ports 10001-10100 must be available on the host. The app binds them when
  # spinning up tenant containers. No static service definition needed here.

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
  # Shared by Caddy and the per-tenant Headscale containers the app creates,
  # so Caddy can reach them by name. Must match HEADSCALE_NETWORK.
  tenants:
    name: atproto-tailnet-tenants
  # Caddy admin API (2019): only Caddy and the app are attached. No egress.
  caddy_admin:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.250.250.0/29
