# docker-compose.production.yml  --  atproto-tailnet production stack
#
# Usage:
#   cp .env.example .env   # then edit with real values
#   docker compose -f docker-compose.production.yml up -d
#
# Prerequisites:
#   - Docker Engine with Compose v2
#   - Wildcard DNS pointing *.ts.yourdomain.com to this host
#   - A TLS strategy selected in .env (see caddy/tls-strategies/)

services:
  # ---------- Application -------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-atproto_tailnet}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-atproto_tailnet}
      SESSION_SECRET: ${SESSION_SECRET}
      PORT: "3000"
      PUBLIC_URL: ${PUBLIC_URL}
      BASE_DOMAIN: ${BASE_DOMAIN}
      CADDY_ADMIN_URL: http://caddy:2019
      HEADSCALE_IMAGE: ${HEADSCALE_IMAGE:-headscale/headscale:0.29.1}
      HEADSCALE_PORT_RANGE_START: ${HEADSCALE_PORT_RANGE_START:-10001}
      HEADSCALE_PORT_RANGE_END: ${HEADSCALE_PORT_RANGE_END:-10100}
      HEADSCALE_DATA_DIR: /data/headscale
      HEADSCALE_NETWORK: atproto-tailnet-tenants
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ATPROTO_PRIVATE_KEY: ${ATPROTO_PRIVATE_KEY:-}
    volumes:
      # Docker socket -- required to manage per-tenant Headscale containers
      - /var/run/docker.sock:/var/run/docker.sock
      # Persistent Headscale tenant data (configs + SQLite DBs)
      - headscale_data:/data/headscale
    networks:
      - internal
    expose:
      - "3000"

  # ---------- PostgreSQL --------------------------------------------------
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atproto_tailnet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-atproto_tailnet}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atproto_tailnet}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------- Caddy reverse proxy ----------------------------------------
  caddy:
    # For on-demand or manual TLS: use stock image (no DNS plugins needed)
    #   image: caddy:2-alpine
    # For DNS-01 strategies: build with the provider module
    #   build:
    #     context: .
    #     dockerfile: Dockerfile.caddy
    #     args:
    #       CADDY_DNS_PLUGINS: "github.com/caddy-dns/route53"
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    build:
      context: .
      dockerfile: Dockerfile.caddy
      args:
        CADDY_DNS_PLUGINS: ${CADDY_DNS_PLUGINS:-}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3 / QUIC
    expose:
      - "2019"           # Admin API (internal only)
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-tailnets.example.com}
      BASE_DOMAIN: ${BASE_DOMAIN}
      # DNS-01 provider credentials (set whichever your strategy needs)
      CF_API_TOKEN: ${CF_API_TOKEN:-}
      DO_AUTH_TOKEN: ${DO_AUTH_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      RFC2136_SERVER: ${RFC2136_SERVER:-}
      RFC2136_KEY_NAME: ${RFC2136_KEY_NAME:-}
      RFC2136_KEY: ${RFC2136_KEY:-}
      ACMEDNS_SERVER_URL: ${ACMEDNS_SERVER_URL:-}
      ACMEDNS_USERNAME: ${ACMEDNS_USERNAME:-}
      ACMEDNS_PASSWORD: ${ACMEDNS_PASSWORD:-}
      ACMEDNS_SUBDOMAIN: ${ACMEDNS_SUBDOMAIN:-}
      HETZNER_API_TOKEN: ${HETZNER_API_TOKEN:-}
      VULTR_API_KEY: ${VULTR_API_KEY:-}
    volumes:
      - ./Caddyfile.production:/etc/caddy/Caddyfile
      - ./caddy/tls-strategies/${TLS_STRATEGY:-on-demand}:/etc/caddy/tls-strategy:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
      - tenants

  # ---------- Headscale port range ----------------------------------------
  # Headscale containers are created dynamically by the app via Docker socket.
  # Ports 10001-10100 must be available on the host. The app binds them when
  # spinning up tenant containers. No static service definition needed here.

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  headscale_data:

networks:
  internal:
    driver: bridge
  # Shared by Caddy and the per-tenant Headscale containers the app creates,
  # so Caddy can reach them by name. Must match HEADSCALE_NETWORK.
  tenants:
    name: atproto-tailnet-tenants
