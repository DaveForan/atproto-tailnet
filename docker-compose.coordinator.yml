# docker-compose.coordinator.yml  --  coordinator-mode stack
#
# Replaces per-tenant Headscale containers with a single Rust coordinator.
# No Docker socket mount required.
#
# Usage:
#   cp .env.coordinator.example .env
#   # Edit .env with real secrets
#   docker compose -f docker-compose.coordinator.yml up -d
#
# Dev usage (local, no TLS):
#   docker compose -f docker-compose.coordinator.yml up -d postgres coordinator caddy
#   # Then run TS service on the host: npm run dev

services:
  # ---------- Rust mesh coordinator: control plane -----------------------
  # Noise control plane and admin API (COORD_ROLE=control). It holds the
  # control key and the admin key, and never the gateway certificate (ADR-0038).
  coordinator:
    build:
      context: ./coordinator
      dockerfile: Dockerfile
    restart: unless-stopped
    # Listens on 9443/tcp only, so it needs no capability. The coord_data
    # volume is the only writable path (control key).
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      COORD_ROLE: control
      COORD_LISTEN: "0.0.0.0:9443"
      COORD_STORE_BACKEND: postgres
      # Caddy forwards device connections; trust its X-Forwarded-For so device
      # sign-in shows the real requester address.
      COORD_TRUSTED_PROXIES: ${EDGE_SUBNET:-10.250.251.0/24}
      COORD_CONTROL_KEY_PATH: /var/lib/coordinator/control.key
      # HTTPS service names (ADR-0038). The relay service runs the gateway.
      COORD_SERVICE_DOMAIN: ${SERVICE_DOMAIN:-svc.${BASE_DOMAIN:?BASE_DOMAIN must be set}}
      # Devices without an auth key are sent here to sign in (ADR-0032)
      COORD_DEVICE_AUTH_URL: ${PUBLIC_URL:?PUBLIC_URL must be set}/device
      COORD_ADMIN_KEY: ${COORDINATOR_API_KEY:?COORDINATOR_API_KEY must be set}
      DATABASE_URL: postgresql://${POSTGRES_USER:-atproto_tailnet}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-atproto_tailnet}
      RUST_LOG: "info"
    volumes:
      - coord_data:/var/lib/coordinator
    expose:
      - "9443"
    networks:
      - internal
      - edge
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9443/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      # Room for first-start migrations
      start_period: 30s

  # ---------- Rust mesh coordinator: relay + gateway ----------------------
  # DERP relay, STUN and the gateway for named HTTPS services (COORD_ROLE=relay,
  # ADR-0027, ADR-0029, ADR-0038). No admin key and no control key: a leak from
  # this internet-facing process exposes only the service certificate.
  relay:
    build:
      context: ./coordinator
      dockerfile: Dockerfile
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      coordinator:
        condition: service_healthy
      relay-keys:
        condition: service_completed_successfully
    environment:
      COORD_ROLE: relay
      COORD_LISTEN: "0.0.0.0:9443"
      COORD_STORE_BACKEND: postgres
      COORD_DERP_HOSTNAME: ${DERP_DOMAIN:?DERP_DOMAIN must be set (relay and gateway)}
      COORD_DERP_KEY_PATH: /var/lib/relay/derp.key
      COORD_GATEWAY_SECRET_PATH: /var/lib/relay/gateway.key
      # The gateway-certs service copies only the *.SERVICE_DOMAIN certificate
      COORD_SERVICE_DOMAIN: ${SERVICE_DOMAIN:-svc.${BASE_DOMAIN:?BASE_DOMAIN must be set}}
      COORD_GATEWAY_CERT: /certs/tls.crt
      COORD_GATEWAY_KEY: /certs/tls.key
      # The gateway registers its nodes, so it needs write access to the coordinator tables
      DATABASE_URL: postgresql://${POSTGRES_USER:-atproto_tailnet}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-atproto_tailnet}
      RUST_LOG: "info"
    volumes:
      - relay_data:/var/lib/relay
      - gateway_certs:/certs:ro
    expose:
      - "9443"
    ports:
      # STUN: devices learn their public address here to find direct paths
      - "${STUN_PORT:-3478}:3478/udp"
    networks:
      - internal
      - edge
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9443/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s

  # ---------- Relay keys --------------------------------------------------
  # One-time move: earlier versions kept derp.key and gateway.key next to the
  # control key. The same gateway.key keeps the same gateway node in each tailnet.
  relay-keys:
    build:
      context: ./coordinator
      dockerfile: Dockerfile
    user: root
    restart: "no"
    network_mode: none
    entrypoint:
      - /bin/sh
      - -c
      - |
        umask 077
        for k in derp.key gateway.key; do
          if [ -f /old/$$k ] && [ ! -f /new/$$k ]; then
            install -o coord -g coord -m 0600 /old/$$k /new/$$k && echo "moved $$k"
          fi
        done
        chown coord:coord /new
    volumes:
      - coord_data:/old:ro
      - relay_data:/new

  # ---------- Certificate for the gateway ---------------------------------
  # Caddy obtains the wildcard certificate of SERVICE_DOMAIN (DNS-01 strategies
  # only). Its files are readable by root only, so this service copies that
  # one certificate to a volume that only the relay reads (ADR-0038).
  gateway-certs:
    build:
      context: ./coordinator
      dockerfile: Dockerfile
    user: root
    restart: unless-stopped
    network_mode: none
    environment:
      SERVICE_DOMAIN: ${SERVICE_DOMAIN:-svc.${BASE_DOMAIN:?BASE_DOMAIN must be set}}
    entrypoint: ["/bin/sh", "/usr/local/bin/copy-gateway-cert.sh"]
    volumes:
      - ./deploy/copy-gateway-cert.sh:/usr/local/bin/copy-gateway-cert.sh:ro
      - caddy_data:/caddy:ro
      - gateway_certs:/certs

  # ---------- TypeScript service ------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Listens on 3000 only. Node writes its compile cache to /tmp.
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
      coordinator:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-atproto_tailnet}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-atproto_tailnet}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set}
      PORT: "3000"
      PUBLIC_URL: ${PUBLIC_URL:?PUBLIC_URL must be set}
      BASE_DOMAIN: ${BASE_DOMAIN:?BASE_DOMAIN must be set}
      # Shared control URL host for all tailnets (ADR-0026); not under BASE_DOMAIN
      CONTROL_DOMAIN: ${CONTROL_DOMAIN:-}
      TAILNET_DNS_UPSTREAM: ${TAILNET_DNS_UPSTREAM:-}
      # Caddy admin lives on the private caddy_admin network (app only)
      CADDY_ADMIN_URL: http://10.250.250.2:2019
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ATPROTO_PRIVATE_KEY: ${ATPROTO_PRIVATE_KEY:-}
      FEDERATION_KEY_ENCRYPTION_KEY: ${FEDERATION_KEY_ENCRYPTION_KEY:-}
      TENANT_PUBLIC_PORT: ${TENANT_PUBLIC_PORT:-}
      # Single-organisation self-hosting only: allow webhooks to private hosts
      WEBHOOK_ALLOW_PRIVATE: ${WEBHOOK_ALLOW_PRIVATE:-false}
      FEDERATION_ENABLED: ${FEDERATION_ENABLED:-false}
      # Caddy is the single proxy in front of the app
      TRUST_PROXY: "1"
      OPERATOR_DIDS: ${OPERATOR_DIDS:-}
      # Coordinator mode — no Docker socket, no Headscale containers
      COORDINATOR_URL: http://coordinator:9443
      COORDINATOR_API_KEY: ${COORDINATOR_API_KEY:?COORDINATOR_API_KEY must be set}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks:
      internal:
      edge:
      # Fixed address so it can never take Caddy's (10.250.250.2)
      caddy_admin:
        ipv4_address: 10.250.250.3

  # ---------- PostgreSQL --------------------------------------------------
  postgres:
    image: postgres:17-alpine@sha256:526f86d93c6ea08fd3f1fe5605650cacc781b2c6013169a0ad8f42c7d3d84f32
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atproto_tailnet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-atproto_tailnet}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atproto_tailnet}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------- Caddy reverse proxy ----------------------------------------
  caddy:
    image: ${CADDY_IMAGE:-atproto-tailnet-caddy:local}
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile.caddy
      args:
        CADDY_DNS_PLUGINS: ${CADDY_DNS_PLUGINS:-}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
      - "${CADDY_HTTPS_PORT:-443}:443/udp"
    environment:
      # Admin API bound to the caddy_admin network only — not reachable from
      # the coordinator or anything else on the edge network.
      CADDY_ADMIN_LISTEN: 10.250.250.2:2019
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN must be set}
      CONTROL_DOMAIN: ${CONTROL_DOMAIN:-control.localhost}
      DERP_DOMAIN: ${DERP_DOMAIN:-derp.localhost}
      BASE_DOMAIN: ${BASE_DOMAIN:?BASE_DOMAIN must be set}
      SERVICE_DOMAIN: ${SERVICE_DOMAIN:-svc.${BASE_DOMAIN:?BASE_DOMAIN must be set}}
      # DERP and STUN run in the relay service
      RELAY_UPSTREAM: relay:9443
      CF_API_TOKEN: ${CF_API_TOKEN:-}
      DO_AUTH_TOKEN: ${DO_AUTH_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      RFC2136_SERVER: ${RFC2136_SERVER:-}
      RFC2136_KEY_NAME: ${RFC2136_KEY_NAME:-}
      RFC2136_KEY: ${RFC2136_KEY:-}
      ACMEDNS_SERVER_URL: ${ACMEDNS_SERVER_URL:-}
      ACMEDNS_USERNAME: ${ACMEDNS_USERNAME:-}
      ACMEDNS_PASSWORD: ${ACMEDNS_PASSWORD:-}
      ACMEDNS_SUBDOMAIN: ${ACMEDNS_SUBDOMAIN:-}
      HETZNER_API_TOKEN: ${HETZNER_API_TOKEN:-}
      VULTR_API_KEY: ${VULTR_API_KEY:-}
    volumes:
      - ./Caddyfile.coordinator.production:/etc/caddy/Caddyfile
      - ./caddy/tls-strategies/${TLS_STRATEGY:-on-demand}:/etc/caddy/tls-strategy:ro
      # Only used by TLS_STRATEGY=manual (wildcard.pem + wildcard.key)
      - ${CADDY_CERTS_DIR:-./caddy/certs}:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge:
      caddy_admin:
        ipv4_address: 10.250.250.2

volumes:
  coord_data:
  relay_data:
  gateway_certs:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  # Postgres lives only here; Caddy is never attached to it.
  internal:
    driver: bridge
  # Caddy and the services it proxies.
  edge:
    driver: bridge
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-10.250.251.0/24}
  # Caddy admin API (2019): only Caddy and the app are attached. No egress.
  caddy_admin:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.250.250.0/29
