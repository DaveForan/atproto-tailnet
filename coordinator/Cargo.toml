[workspace]
resolver = "2"
members = [
    "crates/coord-core",
    "crates/coord-noise",
    "crates/coord-proto",
    "crates/coord-netmap",
    "crates/coord-acl",
    "crates/coord-store",
    "crates/coord-api",
    "crates/coord-federation",
    "crates/coord-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
# Core
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tokio = { version = "1", features = ["full"] }
bytes = "1"

# Crypto
snow = { version = "0.10", features = ["risky-raw-split"] }
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
curve25519-dalek = "4"
rand = "0.9"

# Network
axum = { version = "0.8", features = ["ws"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
http = "1"

# Storage
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "uuid", "chrono", "json"] }
chrono = { version = "0.4", features = ["serde"] }

# Workspace crates
coord-core = { path = "crates/coord-core" }
coord-noise = { path = "crates/coord-noise" }
coord-proto = { path = "crates/coord-proto" }
coord-netmap = { path = "crates/coord-netmap" }
coord-acl = { path = "crates/coord-acl" }
coord-store = { path = "crates/coord-store" }
coord-api = { path = "crates/coord-api" }
coord-federation = { path = "crates/coord-federation" }
coord-server = { path = "crates/coord-server" }

hex = "0.4"
ipnetwork = "0.21"
toml = "0.8"
zstd = "0.13"
tokio-stream = "0.1"

[profile.release]
lto = "thin"
strip = true
