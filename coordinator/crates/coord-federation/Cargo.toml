[package]
name = "coord-federation"
description = "Federation broker, CFP protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
coord-core = { workspace = true }
serde = { workspace = true }
# float_roundtrip: correctly-rounded float parsing, required for JCS parity with JS.
serde_json = { workspace = true, features = ["float_roundtrip"] }
chrono = { workspace = true }
ipnetwork = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
uuid = { workspace = true }
sqlx = { workspace = true }
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json"] }
url = "2"
ed25519-dalek = "2"
base64 = "0.22"

[dev-dependencies]
tokio = { workspace = true }
sqlx = { workspace = true, features = ["migrate"] }
serde_json = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
hmac = "0.12"
sha2 = "0.10"
