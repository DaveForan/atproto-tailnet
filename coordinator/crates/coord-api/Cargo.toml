[package]
name = "coord-api"
description = "REST management API (axum)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
coord-core = { workspace = true }
coord-acl = { workspace = true }
coord-noise = { workspace = true }
coord-proto = { workspace = true }
coord-store = { workspace = true }
coord-netmap = { workspace = true }
coord-derp = { workspace = true }
coord-gateway = { workspace = true }
rand = { workspace = true }
coord-federation = { workspace = true }
async-trait = "0.1"
axum = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
bytes = { workspace = true }
hex = { workspace = true }
ipnetwork = { workspace = true }
uuid = { workspace = true }
zstd = { workspace = true }
tokio-stream = { workspace = true }
subtle = "2"
sha2 = "0.10"

[features]
# Exposes `__test_*` hooks for this crate's integration tests.
test-hooks = []

[dev-dependencies]
coord-api = { path = ".", features = ["test-hooks"] }
tower = { workspace = true }
crypto_box = { version = "0.9", features = ["salsa20"] }
boringtun = { version = "0.7", default-features = false }
reqwest = { version = "0.12", features = ["json"] }
h2 = "0.4"
snow = { workspace = true }
base64 = "0.22"
serde_json = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true }
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
