[package]
name = "coord-gateway"
version.workspace = true
edition.workspace = true

[dependencies]
coord-derp = { workspace = true }
# Primitive crates only (ADR-0029): WireGuard cryptography, a userspace
# TCP/IP stack and TLS. No Tailscale code.
boringtun = { version = "0.7", default-features = false }
smoltcp = { version = "0.14", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "socket-tcp", "socket-icmp"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = { version = "1.9", features = ["std"] }
# Reads the names of the certificate, to refuse one that covers more than service names
x509-parser = "0.18"
hyper = { workspace = true }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
async-trait = "0.1"
blake2 = "0.10"
rand = { workspace = true }

[dev-dependencies]
rcgen = "0.14"
async-trait = "0.1"
tokio = { workspace = true, features = ["test-util"] }
